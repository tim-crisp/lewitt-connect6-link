name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: bash -n build.sh package-dmg.sh test.sh Tools/ci-signing.sh Tools/notarize.sh Tools/verify-package.sh
      - name: Test without hardware
        run: bash test.sh
      - name: Compile both architectures
        run: bash build.sh
      - name: Package and inspect DMG
        run: |
          bash package-dmg.sh
          bash Tools/verify-package.sh
