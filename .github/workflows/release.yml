name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    needs: tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NOTARIZE_RELEASES: ${{ vars.NOTARIZE_RELEASES }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Info.plist must contain a numeric major.minor.patch version.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The release tag must match CFBundleShortVersionString in Info.plist.' >&2
            exit 1
          fi
          if [[ -n "$NOTARIZE_RELEASES" && "$NOTARIZE_RELEASES" != true && "$NOTARIZE_RELEASES" != false ]]; then
            echo 'NOTARIZE_RELEASES must be true, false, or unset.' >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: env.NOTARIZE_RELEASES == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash Tools/ci-signing.sh import
      - name: Build universal application
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: |
          if [[ "$NOTARIZE_RELEASES" == true ]]; then
            export SIGNING_IDENTITY="$MACOS_SIGNING_IDENTITY"
          fi
          bash build.sh
      - name: Notarize and staple application
        if: env.NOTARIZE_RELEASES == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash Tools/notarize.sh 'dist/CONNECT 6 Link.app'
      - name: Build DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: |
          if [[ "$NOTARIZE_RELEASES" == true ]]; then
            export SIGNING_IDENTITY="$MACOS_SIGNING_IDENTITY"
          fi
          bash package-dmg.sh
      - name: Notarize and staple DMG
        if: env.NOTARIZE_RELEASES == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          bash Tools/notarize.sh "dist/CONNECT6Link-$version-universal.dmg"
      - name: Verify packaged app
        run: bash Tools/verify-package.sh
      - name: Checksums and release information
        shell: bash
        run: |
          cd dist
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          if [[ "$NOTARIZE_RELEASES" == true ]]; then
            printf '%s\n' 'Universal app for Intel and Apple Silicon, macOS 13+.' \
              'Developer ID signed and notarized by Apple; app and DMG tickets are stapled.' > RELEASE-INFO.txt
          else
            printf '%s\n' 'Universal app for Intel and Apple Silicon, macOS 13+.' \
              'This build is ad hoc signed and is NOT notarized by Apple.' \
              'macOS may block first launch. For a trusted download, use System Settings > Privacy & Security > Open Anyway.' \
              'Organization-managed Macs may prohibit unnotarized apps.' > RELEASE-INFO.txt
          fi
          printf '\n%s\n' 'Requires one LEWITT CONNECT 6 with firmware 2.2.7. Independent software; not affiliated with LEWITT.' >> RELEASE-INFO.txt
          python3 - <<'PYNOTES'
          from pathlib import Path
          import plistlib
          version = plistlib.loads(Path('../Info.plist').read_bytes())['CFBundleShortVersionString']
          lines = Path('../CHANGELOG.md').read_text().splitlines()
          notes = []
          collecting = False
          for line in lines:
              if line.startswith('## '):
                  if collecting:
                      break
                  collecting = line.removeprefix('## ').split()[0] == version
              elif collecting:
                  notes.append(line)
          if not notes:
              raise SystemExit('Missing changelog entry for this release version.')
          with Path('RELEASE-INFO.txt').open('a') as output:
              output.write('\n## Changes\n' + '\n'.join(notes).strip() + '\n')
          PYNOTES
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connect6-link-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/RELEASE-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove signing credentials
        if: always() && env.NOTARIZE_RELEASES == 'true'
        run: bash Tools/ci-signing.sh cleanup

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connect6-link-universal
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release-assets
          shasum -a 256 --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft existing-release.json)" != true ]]; then
              echo 'This release is already published; leaving its assets unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "CONNECT 6 Link $RELEASE_TAG" --notes-file RELEASE-INFO.txt
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg SHA256SUMS.txt RELEASE-INFO.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
